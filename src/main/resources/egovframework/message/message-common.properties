bytrox.legal.privacypolicy.001=ByTrox Global Privacy Notice
bytrox.legal.privacypolicy.002=We prioritise your privacy and the security of your personal information. We understand the trust you place in us when sharing your information and are committed to protecting it in accordance with the highest standards of privacy law globally.
bytrox.legal.privacypolicy.003=Your Consent
bytrox.legal.privacypolicy.004=By engaging with our services, using our websites or platforms, by applying to work with us, or by providing us with your personal information directly or indirectly, you consent to the collection, use, and disclosure of your personal information as outlined in this Privacy Notice. This consent is granted when you submit information through our application forms, during communications with us, or by using our digital services. Your continued use of our services signifies your acceptance of this Privacy Notice and any updates to it.
bytrox.legal.privacypolicy.005=Purpose of Data Collection
bytrox.legal.privacypolicy.006=ByTrox collects personal information to provide you with our products and services, or to employ you.
bytrox.legal.privacypolicy.007=Category
bytrox.legal.privacypolicy.008=Description
bytrox.legal.privacypolicy.009=Assessment and Account Management
bytrox.legal.privacypolicy.010=To evaluate your applications, manage your account, and deliver the services you have requested.
bytrox.legal.privacypolicy.011=Compliance and Regulatory
bytrox.legal.privacypolicy.012=To meet our regulatory and legal obligations, including identity verification and anti-money laundering checks.
bytrox.legal.privacypolicy.013=Service Enhancement
bytrox.legal.privacypolicy.014=To improve our offerings, customer service, and develop new products that meet customer and market needs.
bytrox.legal.privacypolicy.015=Communication
bytrox.legal.privacypolicy.016=To keep you informed about relevant opportunities, updates, and offerings from ByTrox.
bytrox.legal.privacypolicy.017=Direct Marketing
bytrox.legal.privacypolicy.018=To offer you products and services that we believe may interest you.
bytrox.legal.privacypolicy.019=Types of Personal Information Collected
bytrox.legal.privacypolicy.020=The personal information we collect depends on the products and services we offer and how you deal with us, or if you have applied to work with us.
bytrox.legal.privacypolicy.021=Personal Information
bytrox.legal.privacypolicy.022=What this includes
bytrox.legal.privacypolicy.023=Identity, demographic and contact details
bytrox.legal.privacypolicy.024=Name, date of birth, mailing and residential address, telephone numbers, and email address.
bytrox.legal.privacypolicy.025=Age, gender, country of birth, citizenship or residency status, relationship status and family circumstances.
bytrox.legal.privacypolicy.026=Government related identifiers and identity documents
bytrox.legal.privacypolicy.027=Concession, passport, visa, driver licence, and tax file number.
bytrox.legal.privacypolicy.028=Copies of other government identification numbers or documents such as birth and marriage certificates.
bytrox.legal.privacypolicy.029=Employment information
bytrox.legal.privacypolicy.030=If you are a client, employment status, salary, and role.
bytrox.legal.privacypolicy.031=If you work for us or apply to work for us, the above information plus employment history and workplace information.
bytrox.legal.privacypolicy.032=Financial and credit-related information
bytrox.legal.privacypolicy.033=Your bank account and credit card details.
bytrox.legal.privacypolicy.034=Personal insolvency information.
bytrox.legal.privacypolicy.035=Consumer credit information, including loans, credit cards, overdrafts and repayment history.
bytrox.legal.privacypolicy.036=Property and asset-related information
bytrox.legal.privacypolicy.037=Information about property or assets to verify your source of wealth and funds.
bytrox.legal.privacypolicy.038=Website and app tracking
bytrox.legal.privacypolicy.039=Information collected through cookies and other technologies, including pages viewed, location and server address/IP address.
bytrox.legal.privacypolicy.040=Interaction and behavioural information
bytrox.legal.privacypolicy.041=Your queries, complaints, marketing preferences, and information collected during application, trading and transactions.
bytrox.legal.privacypolicy.042=How we collect your personal information
bytrox.legal.privacypolicy.043=We collect your personal information from you, including interactions in person, over the phone, via email, website and mail; from embedded tools on our websites such as cookies and pixels; from third parties including introducing brokers, affiliates and service providers; and from publicly available sources such as social media and government registers.
bytrox.legal.privacypolicy.044=Legal Bases for Processing
bytrox.legal.privacypolicy.045=ByTrox processes your personal information under several legal bases to provide our products and services across our global operations and in compliance with our global obligations.
bytrox.legal.privacypolicy.046=Reason for Processing
bytrox.legal.privacypolicy.047=Description
bytrox.legal.privacypolicy.048=Business administration
bytrox.legal.privacypolicy.049=Billing and financial auditing.
bytrox.legal.privacypolicy.050=Estimating balance sheet reserves.
bytrox.legal.privacypolicy.051=Processing financial transactions.
bytrox.legal.privacypolicy.052=Business decisions and improvements
bytrox.legal.privacypolicy.053=Using data analytics to generate business information and improve our products and services.
bytrox.legal.privacypolicy.054=Identifying opportunities to improve our business, products and services.
bytrox.legal.privacypolicy.055=Consent, including marketing
bytrox.legal.privacypolicy.056=Where you have explicitly agreed to our processing of information for specific purposes, such as marketing communications.
bytrox.legal.privacypolicy.057=Legal and regulatory obligations
bytrox.legal.privacypolicy.058=To comply with financial regulations, anti-money laundering laws, tax laws, employment and labour laws, and dispute resolution obligations.
bytrox.legal.privacypolicy.059=Legitimate interests
bytrox.legal.privacypolicy.060=To improve our services, protect against fraud and enhance customer service, except where overridden by your rights and freedoms.
bytrox.legal.privacypolicy.061=Providing our products and services
bytrox.legal.privacypolicy.062=Actioning your requests and administering your trades and accounts.
bytrox.legal.privacypolicy.063=Answering questions, assessing applications and performing contractual obligations.
bytrox.legal.privacypolicy.064=Responding to complaints and enquiries.
bytrox.legal.privacypolicy.065=Data Sharing
bytrox.legal.privacypolicy.066=Your personal information may be shared within the ByTrox group and with external third parties under controlled and secure conditions.
bytrox.legal.privacypolicy.067=Group
bytrox.legal.privacypolicy.068=Description
bytrox.legal.privacypolicy.069=ByTrox Group
bytrox.legal.privacypolicy.070=Across our global offices for account management, operational support, and service provision.
bytrox.legal.privacypolicy.071=Regulatory and Legal Compliance
bytrox.legal.privacypolicy.072=With regulators, law enforcement, and other governmental authorities as required by law.
bytrox.legal.privacypolicy.073=Service Providers
bytrox.legal.privacypolicy.074=With third-party service providers who support our operations, including IT support, marketing, and customer service.
bytrox.legal.privacypolicy.075=Business Partners
bytrox.legal.privacypolicy.076=As necessary to provide requested services or where you have chosen to use an introducing broker, money manager, affiliate or other third party.
bytrox.legal.privacypolicy.077=Sharing overseas
bytrox.legal.privacypolicy.078=ByTrox operates globally through its owned and controlled entities and service providers. Your personal information may be shared with recipients in locations around the world where required to provide our services or comply with applicable law.
bytrox.legal.privacypolicy.079=If you do not provide us with your personal information
bytrox.legal.privacypolicy.080=You do not have to provide us, our agents, introducing brokers, affiliates, or service providers with personal information when seeking our products or services. However, if you do not provide information we require, we may not be able to provide the products or services you request, or employ you.
bytrox.legal.privacypolicy.081=Protection Measures
bytrox.legal.privacypolicy.082=We are committed to protecting your personal information through encryption, firewalls, secure server facilities, access controls, and regular staff training on data protection and privacy.
bytrox.legal.privacypolicy.083=Rights of Individuals
bytrox.legal.privacypolicy.084=Right
bytrox.legal.privacypolicy.085=Description
bytrox.legal.privacypolicy.086=Access
bytrox.legal.privacypolicy.087=You can request access to the personal information we hold about you.
bytrox.legal.privacypolicy.088=Correction
bytrox.legal.privacypolicy.089=Request correction of inaccurate personal information.
bytrox.legal.privacypolicy.090=Erasure and Restriction
bytrox.legal.privacypolicy.091=Ask for your information to be deleted in certain circumstances or request restriction of processing.
bytrox.legal.privacypolicy.092=Portability and Object
bytrox.legal.privacypolicy.093=Obtain and reuse your data for your own purposes or object to processing based on legitimate interests or direct marketing.
bytrox.legal.privacypolicy.094=Withdraw Consent
bytrox.legal.privacypolicy.095=Where processing is based on consent, you may withdraw that consent at any time.
bytrox.legal.privacypolicy.096=Cookies and Tracking Technologies
bytrox.legal.privacypolicy.097=ByTrox utilises cookies and similar tracking technologies on our websites and applications to enhance user experience and gather analytical data. You can accept or decline cookies through your browser settings, although disabling cookies may limit some site functions.
bytrox.legal.privacypolicy.098=Changes to This Policy
bytrox.legal.privacypolicy.099=ByTrox may update or modify this Privacy Notice to reflect changes in our practices, technology, legal requirements, or other factors. We encourage you to review this policy periodically.
bytrox.legal.privacypolicy.100=Contact Us
bytrox.legal.privacypolicy.101=For questions about this Privacy Notice, or to make a complaint about the way we handle your personal information, contact our Privacy Officer at
bytrox.legal.privacypolicy.102=support@bytroxfx.com
