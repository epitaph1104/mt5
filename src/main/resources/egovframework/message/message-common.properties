bytrox.legal.termsofservice.024=If your complaint remains unresolved, our Compliance department will review it and contact you directly. You can also contact the Compliance team by email at
bytrox.legal.termsofservice.025=support@bytroxfx.com
bytrox.legal.termsofservice.026=We aim to resolve most matters within 21 days. Some complaints are more complex and may take longer; where this occurs, we will keep you informed of our progress.
